name: Uppdatera skolmenyer

on:
  schedule:
    # GitHub Actions använder UTC. Kör på båda sidor om svensk sommar-/vintertid
    # så att menyn uppdateras på morgonen och förmiddagen året runt.
    - cron: "30 3,4,8,9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-school-menus
  cancel-in-progress: false

jobs:
  fetch-menus:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Installera Tesseract
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr

      - name: Hämta aktuella menyer
        run: python3 scripts/fetch-menus.py

      - name: Spara menyfilen säkert mellan jobben
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updated-menu-data
          path: data/menus.json
          if-no-files-found: error
          retention-days: 1

  commit-menus:
    needs: fetch-menus
    if: needs.fetch-menus.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Hämta den uppdaterade menyfilen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updated-menu-data
          path: data

      - name: Spara ändrade menyer
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "Menyerna är redan aktuella."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "Uppdatera skolmenyer"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
