name: Uppdatera skolmenyer

on:
  schedule:
    # Kör en gång vid 06:15 svensk tid: 05:15 UTC vintertid, 04:15 UTC sommartid.
    # Båda tiderna startas och jobbet nedan väljer rätt körning med Europe/Stockholm.
    - cron: "15 4,5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-school-menus
  cancel-in-progress: false

jobs:
  scheduled-time:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.schedule.outputs.run }}

    steps:
      - name: Kontrollera om det är schemalagd svensk körtid
        id: schedule
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Stockholm date +%H:%M)" != "06:15" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  fetch-menus:
    needs: scheduled-time
    if: needs.scheduled-time.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Installera Tesseract
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr

      - name: Hämta aktuella menyer
        run: python3 scripts/fetch-menus.py

      - name: Spara menyfilen säkert mellan jobben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updated-menu-data
          path: data/menus.json
          if-no-files-found: error
          retention-days: 1

  commit-menus:
    needs: fetch-menus
    if: needs.fetch-menus.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Hämta den uppdaterade menyfilen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: updated-menu-data
          path: data

      - name: Spara ändrade menyer
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "Menyerna är redan aktuella."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "Uppdatera skolmenyer"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
